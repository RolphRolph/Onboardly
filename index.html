<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboard · Kundonboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- Länk till CSS-filen -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <h1>Onboardly</h1>
  </div>
  <div id="client-block">
    <button id="client-btn" type="button">
      <span class="cb-text">
        <span class="cb-cap" id="client-cap-label">Ingen kund vald</span>
        <span class="cb-main">
          <span class="cb-name" id="client-name-label">Välj eller skapa kund</span>
        </span>
        <span class="cb-progress" id="client-progress" hidden>
          <span class="cb-progress-meta" id="client-progress-meta"></span>
          <span class="client-progress-track" aria-hidden="true">
            <span class="client-progress-fill" id="client-progress-fill"></span>
          </span>
        </span>
      </span>
    </button>
    <button id="client-switch-btn" type="button" aria-label="Välj eller skapa kund">
      <span class="cb-chevron" id="client-action-label">›</span>
    </button>
  </div>
  <div class="tabs-heading">Faser</div>
  <nav id="tabs" aria-label="Arbetsfaser"></nav>
  <nav id="summary-nav" aria-label="Översikt"></nav>
  <div class="mobile-navigation"><label for="phase-select">Gå till</label><select id="phase-select"></select></div>
  <div id="sidebar-footer">
    <button id="reset-btn" type="button">Nollställ onboarding för vald kund</button>
    <div id="save-status" role="status" aria-live="polite">Sparas automatiskt i den här webbläsaren</div>
  </div>
</aside>

<main id="main"></main>

<!-- Länk till JavaScript-filen -->
<script src="script.js"></script>
</body>
</html>
